services:
  api:
    container_name: "api"
    build:
      context: ./src
      dockerfile: ServiceLayer.API/Dockerfile
    platform: linux/amd64
    restart: always
    environment:
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      AzureWebJobsStorage: "${AZURITE_CONNECTION_STRING}"
      AzureWebJobsSecretStorageType: "files"
      DatabaseConnectionString: "${DatabaseConnectionString}"
      EVENT_GRID_TOPIC_URL: "${EVENT_GRID_TOPIC_URL}"
      EVENT_GRID_TOPIC_KEY: "${EVENT_GRID_TOPIC_KEY}"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    ports:
      - "${API_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      azurite:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend

  mesh-ingest:
    container_name: "mesh-ingest"
    build:
      context: ./src
      dockerfile: ServiceLayer.MESH/Dockerfile
    platform: linux/amd64
    restart: always
    environment:
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      AzureWebJobsStorage: "${AZURITE_CONNECTION_STRING}"
      AzureWebJobsSecretStorageType: "files"
      DatabaseConnectionString: "${DatabaseConnectionString}"
      FileDiscoveryTimerExpression: "${FileDiscoveryTimerExpression}"
      MeshHandshakeTimerExpression: "${MeshHandshakeTimerExpression}"
      FileRetryTimerExpression: "${FileRetryTimerExpression}"
      FileExtractQueueName: "${FileExtractQueueName}"
      FileTransformQueueName: "${FileTransformQueueName}"
      StaleHours: "${StaleHours}"
      MeshApiBaseUrl: "http://mesh_sandbox:80/messageexchange"
      NbssMailboxId: "${NbssMailboxId}"
      MeshPassword: "${MeshPassword}"
      MeshSharedKey: "${MeshSharedKey}"
      AZURITE_CONNECTION_STRING: "${AZURITE_CONNECTION_STRING}"
      MeshStorageAccountUrl: "${AZURITE_CONNECTION_STRING}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      BlobContainerName: "${BlobContainerName}"
    ports:
      - "${MESH_INGEST_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      azurite:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend

  azurite:
    container_name: "azurite"
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: always
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log"
    ports:
      - "${AZURITE_BLOB_PORT}:10000"
      - "${AZURITE_QUEUE_PORT}:10001"
      - "${AZURITE_TABLE_PORT}:10002"
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh -c 'nc -z 127.0.0.1 10000 || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - azurite-data:/data
    networks:
      - backend

  db:
    container_name: "db"
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DATABASE_PASSWORD}"
    ports:
      - "1433:1433"
    user: "root"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sqlservr || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s
    networks:
      - backend

  db-migrations:
    container_name: db-migrations
    build:
      context: .
      dockerfile: src/ServiceLayer.Common/Dockerfile.migrations
      args:
        DatabaseConnectionString: "${DatabaseConnectionString}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_NAME: "${DATABASE_NAME}"
      DATABASE_USER: "${DATABASE_USER}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
    networks:
      - backend

networks:
  backend:
    name: backend-network
    driver: bridge
volumes:
  azurite-data:
    name: azurite-data
  db-data:
    name: db-data
    driver: local
